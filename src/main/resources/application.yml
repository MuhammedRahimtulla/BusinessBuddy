# BusinessBuddy: AI-Powered Business Cost and Inventory Management System
# Shared settings. Environment-specific values live in application-<profile>.yml.
spring:
  application:
    name: businessbuddy
  profiles:
    default: local
  jpa:
    # Kept on deliberately: Thymeleaf views read lazy relations (for example a product's category)
    # after the service transaction ends. Writes still happen only inside service transactions.
    open-in-view: true
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.businessbuddy: INFO
    org.tribuo: WARN

businessbuddy:
  security:
    max-failed-logins: 5
    lockout-minutes: 15
  inventory:
    cost-increase-threshold: 0.10   # 10% rise raises a COST_INCREASE notification
    expiry-warning-days: 7
  forecast:
    min-history-days: 56
    test-days: 14
    horizon-days: 7
    moving-average-days: 28
    stockout-window-days: 28
    stockout-min-days: 14
    stockout-warning-days: 7
  insights:
    cost-rise-threshold: 0.10
    demand-change-threshold: 0.30
  jobs:
    nightly-cron: "0 30 1 * * *"     # 01:30 every night, outside trading hours

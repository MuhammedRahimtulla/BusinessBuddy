<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Purchases | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head">
        <div><h1>Purchases</h1><p>Stock changes only when a purchase is received.</p></div>
        <a class="btn btn-primary" th:href="@{/purchases/new}"><i class="bi bi-plus-lg"></i> New purchase</a>
    </div>
    <form class="row g-2 mb-3" method="get" th:action="@{/purchases}">
        <div class="col-auto"><label class="visually-hidden" for="status">Status</label>
            <select class="form-select" id="status" name="status">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
            </select></div>
        <div class="col-auto"><button class="btn btn-outline-primary" type="submit">Filter</button></div>
    </form>
    <div class="table-wrap">
        <table class="table table-hover align-middle">
            <thead><tr><th>Date</th><th>Reference</th><th>Supplier</th><th>Status</th><th>Received</th><th class="num">Total</th></tr></thead>
            <tbody>
            <tr th:each="p : ${page.content}">
                <td th:text="${@fmt.date(p.purchaseDate)}"></td>
                <td><a th:href="@{/purchases/{id}(id=${p.id})}" th:text="${p.referenceNo}"></a></td>
                <td th:text="${p.supplier.name}"></td>
                <td><span class="status" th:classappend="'status-' + ${p.status}" th:text="${p.status}"></span></td>
                <td th:text="${@fmt.date(p.receivedDate)}"></td>
                <td class="num" th:text="|${p.currencyCode} ${@fmt.money(p.totalAmount)}|"></td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="6" class="empty-state">No purchases found.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-2" th:insert="~{fragments/ui :: pager('/purchases' + (${status} != null ? '?status=' + ${status} : ''))}"></div>
</main>
</body>
</html>

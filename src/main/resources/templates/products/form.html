<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Product | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><h1 th:text="${id == null} ? 'New product' : 'Edit product'">Product</h1></div>
    <div class="card form-card"><div class="card-body">
        <form th:action="${id == null} ? @{/products} : @{/products/{id}(id=${id})}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/ui :: errors('form')}"></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label required" for="name">Product name</label>
                    <input class="form-control" th:field="*{name}" maxlength="120" required th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div></div>
                <div class="col-md-3"><label class="form-label" for="sku">SKU</label>
                    <input class="form-control" th:field="*{sku}" maxlength="40"></div>
                <div class="col-md-3"><label class="form-label" for="categoryId">Category</label>
                    <select class="form-select" th:field="*{categoryId}"><option value="">None</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div>
                <div class="col-md-6"><span class="form-label required d-block">Type</span>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" th:field="*{type}" value="MANUFACTURED">
                        <label class="form-check-label" th:for="${#ids.prev('type')}">Made in-house (has a recipe)</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" th:field="*{type}" value="RESALE">
                        <label class="form-check-label" th:for="${#ids.prev('type')}">Bought for resale</label></div></div>
                <div class="col-md-3"><label class="form-label required" for="saleUnitCode">Unit of sale</label>
                    <select class="form-select" th:field="*{saleUnitCode}">
                        <option th:each="u : ${units}" th:value="${u.code}" th:text="|${u.name} (${u.code})|"></option></select></div>
                <div class="col-md-3"><label class="form-label required" for="sellingPrice">Selling price (excl. tax)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{sellingPrice}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{sellingPrice}"></div></div>
                <div class="col-md-3"><label class="form-label required" for="minStockLevel">Minimum stock</label>
                    <input class="form-control" type="number" step="0.001" min="0" th:field="*{minStockLevel}"></div>
                <div class="col-md-9"><label class="form-label" for="description">Description</label>
                    <input class="form-control" th:field="*{description}" maxlength="500"></div>
                <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label" th:for="${#ids.prev('active')}">Active (can be sold)</label></div>
            </div>
            <div class="mt-3 d-flex gap-2"><button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a></div>
        </form>
    </div></div>
</main>
</body>
</html>

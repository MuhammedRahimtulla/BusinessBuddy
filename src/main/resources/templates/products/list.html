<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Products | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head">
        <div><h1>Products</h1><p>Prices are shown excluding tax.</p></div>
        <a sec:authorize="hasAnyRole('OWNER','MANAGER')" class="btn btn-primary" th:href="@{/products/new}"><i class="bi bi-plus-lg"></i> New product</a>
    </div>
    <form class="row g-2 mb-3" method="get" th:action="@{/products}" role="search">
        <div class="col-sm-6 col-md-4"><label class="visually-hidden" for="q">Search</label>
            <input class="form-control" id="q" name="q" th:value="${q}" placeholder="Search by name or SKU"></div>
        <div class="col-auto"><button class="btn btn-outline-primary" type="submit">Search</button></div>
    </form>
    <div class="table-wrap">
        <table class="table table-hover align-middle">
            <thead><tr><th>Name</th><th>SKU</th><th>Type</th><th class="num">Price</th><th class="num">In stock</th>
                <th class="num" th:if="${canSeeMoney}">Avg cost</th><th>Status</th></tr></thead>
            <tbody>
            <tr th:each="p : ${page.content}">
                <td><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></td>
                <td th:text="${p.sku}"></td>
                <td th:text="${p.manufactured} ? 'Made in-house' : 'Resale'"></td>
                <td class="num" th:text="${@fmt.money(p.sellingPrice)}"></td>
                <td class="num" th:classappend="${p.belowMinimum} ? 'text-negative'" th:text="${@fmt.qty(p.currentQuantity)}"></td>
                <td class="num" th:if="${canSeeMoney}" th:text="${@fmt.cost(p.averageUnitCost)}"></td>
                <td><span th:if="${!p.active}" class="status status-CANCELLED">Inactive</span></td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="7" class="empty-state">No products found.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-2" th:insert="~{fragments/ui :: pager('/products?q=' + ${q})}"></div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Expenses | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head">
        <div><h1>Operating expenses</h1><p>Costs already included in recipes (labour, packaging, utilities, overhead) should not be entered again here.</p></div>
        <a class="btn btn-primary" th:href="@{/expenses/new}"><i class="bi bi-plus-lg"></i> New expense</a>
    </div>
    <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/expenses}">
        <div class="col-auto"><label class="form-label" for="categoryId">Category</label>
            <select class="form-select form-select-sm" id="categoryId" name="categoryId"><option value="">All</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option></select></div>
        <div class="col-auto"><label class="form-label" for="from">From</label>
            <input class="form-control form-control-sm" type="date" id="from" name="from" th:value="${period.from}"></div>
        <div class="col-auto"><label class="form-label" for="to">To</label>
            <input class="form-control form-control-sm" type="date" id="to" name="to" th:value="${period.to}"></div>
        <div class="col-auto"><button class="btn btn-sm btn-outline-primary" type="submit">Apply</button></div>
        <div class="col text-end"><strong th:text="|Total for period: ${currency} ${@fmt.money(total)}|"></strong></div>
    </form>
    <div class="table-wrap">
        <table class="table table-hover">
            <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Supplier</th><th>Payment</th><th>Reference</th><th class="num">Amount</th><th></th></tr></thead>
            <tbody>
            <tr th:each="e : ${page.content}">
                <td th:text="${@fmt.date(e.expenseDate)}"></td><td th:text="${e.category.name}"></td>
                <td th:text="${e.description}"></td><td th:text="${e.supplier?.name}"></td>
                <td th:text="${e.paymentMethod}"></td><td th:text="${e.referenceNo}"></td>
                <td class="num" th:text="${@fmt.money(e.amount)}"></td>
                <td><a th:href="@{/expenses/{id}/edit(id=${e.id})}">Edit</a></td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="8" class="empty-state">No expenses in this period.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-2" th:insert="~{fragments/ui :: pager('/expenses?from=' + ${period.from} + '&to=' + ${period.to})}"></div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | BusinessBuddy</title>
    <link rel="icon" th:href="@{/images/logo.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-wrap">
    <section class="auth-hero">
        <h1>Register your business</h1>
        <p class="lead">You become the business Owner and can add Managers and Employees afterwards.</p>
    </section>
    <section class="auth-form">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="mb-3">BusinessBuddy registration</h2>
                <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                    <div th:replace="~{fragments/ui :: errors('form')}"></div>
                    <div class="mb-2">
                        <label class="form-label required" for="businessName">Business name</label>
                        <input class="form-control" th:field="*{businessName}" required maxlength="150" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{businessName}"></div>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-5">
                            <label class="form-label required" for="currencyCode">Currency</label>
                            <select class="form-select" th:field="*{currencyCode}">
                                <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">ZAR</option>
                            </select>
                        </div>
                        <div class="col-7">
                            <label class="form-label required" for="timeZone">Time zone</label>
                            <select class="form-select" th:field="*{timeZone}">
                                <option th:each="z : ${timeZones}" th:value="${z}" th:text="${z}">Africa/Johannesburg</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label required" for="fullName">Your full name</label>
                        <input class="form-control" th:field="*{fullName}" required maxlength="120" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label required" for="email">Email</label>
                        <input class="form-control" type="email" th:field="*{email}" required autocomplete="username" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label required" for="password">Password</label>
                        <input class="form-control" type="password" th:field="*{password}" required minlength="10" autocomplete="new-password">
                        <div class="form-text">At least 10 characters, not your email and not a common password.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required" for="confirmPassword">Confirm password</label>
                        <input class="form-control" type="password" th:field="*{confirmPassword}" required autocomplete="new-password">
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Create business account</button>
                </form>
                <p class="mt-3 mb-0 text-center"><a th:href="@{/login}">Back to log in</a></p>
            </div>
        </div>
    </section>
</main>
</body>
</html>

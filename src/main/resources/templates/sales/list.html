<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Sales | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head">
        <div><h1>Sales history</h1><p th:text="${me.role.name() == 'EMPLOYEE'} ? 'Sales you recorded.' : 'All sales of the business.'"></p></div>
        <a class="btn btn-primary" th:href="@{/sales/new}"><i class="bi bi-cart-plus"></i> New sale</a>
    </div>
    <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/sales}">
        <div class="col-auto"><label class="form-label" for="status">Status</label>
            <select class="form-select form-select-sm" id="status" name="status"><option value="">All</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option></select></div>
        <div class="col-auto"><label class="form-label" for="from">From</label>
            <input class="form-control form-control-sm" type="date" id="from" name="from" th:value="${period.from}"></div>
        <div class="col-auto"><label class="form-label" for="to">To</label>
            <input class="form-control form-control-sm" type="date" id="to" name="to" th:value="${period.to}"></div>
        <div class="col-auto"><button class="btn btn-sm btn-outline-primary" type="submit">Apply</button></div>
    </form>
    <div class="table-wrap">
        <table class="table table-hover align-middle">
            <thead><tr><th>Sale</th><th>Date</th><th>Customer</th><th>Payment</th><th>Status</th><th>Recorded by</th><th class="num">Total</th></tr></thead>
            <tbody>
            <tr th:each="s : ${page.content}">
                <td><a th:href="@{/sales/{id}(id=${s.id})}" th:text="${s.saleNumber}"></a></td>
                <td th:text="${@fmt.dateTime(s.saleDate, zone)}"></td>
                <td th:text="${s.customer?.name}"></td>
                <td th:text="${s.paymentMethod}"></td>
                <td><span class="status" th:classappend="'status-' + ${s.status}" th:text="${s.status}"></span></td>
                <td th:text="${s.recordedBy.fullName}"></td>
                <td class="num" th:text="${@fmt.money(s.total)}"></td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="7" class="empty-state">No sales in this period.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-2" th:insert="~{fragments/ui :: pager('/sales?from=' + ${period.from} + '&to=' + ${period.to} + (${status} != null ? '&status=' + ${status} : ''))}"></div>
</main>
</body>
</html>

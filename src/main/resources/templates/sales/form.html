<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>New sale | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><div><h1 th:text="${id == null} ? 'New sale' : 'Edit draft sale'">Sale</h1>
        <p th:text="|Prices exclude tax. Tax at ${@fmt.pct(taxRate)} is added to each line. Leave the price empty to use the product's current price.|"></p></div></div>
    <form th:action="${id == null} ? @{/sales} : @{/sales/{id}(id=${id})}" th:object="${form}" method="post" novalidate>
        <div th:replace="~{fragments/ui :: errors('form')}"></div>
        <div class="table-wrap mb-2">
            <table class="table lines-table">
                <thead><tr><th class="item-col">Product</th><th>Quantity</th><th>Unit price</th><th>Discount</th></tr></thead>
                <tbody id="sale-lines">
                <tr th:each="line, st : *{lines}">
                    <td class="item-col"><select class="form-select form-select-sm" aria-label="Product" th:field="*{lines[__${st.index}__].productId}">
                        <option value="">Choose a product</option>
                        <option th:each="p : ${products}" th:value="${p.id}"
                                th:text="|${p.name} · ${@fmt.money(p.sellingPrice)} · in stock ${@fmt.qty(p.currentQuantity)}|"></option></select></td>
                    <td><input class="form-control form-control-sm" type="number" step="0.001" min="0.001" aria-label="Quantity"
                               th:field="*{lines[__${st.index}__].quantity}"></td>
                    <td><input class="form-control form-control-sm" type="number" step="0.01" min="0" aria-label="Unit price"
                               th:field="*{lines[__${st.index}__].unitPrice}" placeholder="Current price"></td>
                    <td><input class="form-control form-control-sm" type="number" step="0.01" min="0" aria-label="Discount"
                               data-default="0" th:field="*{lines[__${st.index}__].discountAmount}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary mb-3" data-add-line="sale-lines"><i class="bi bi-plus"></i> Add product</button>
        <div class="card mb-3"><div class="card-body row g-3">
            <div class="col-md-4"><label class="form-label" for="customerId">Customer (optional)</label>
                <select class="form-select" th:field="*{customerId}"><option value="">Walk-in customer</option>
                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}"></option></select>
                <a class="small" th:href="@{/customers/new}">Add a customer</a></div>
            <div class="col-md-8"><span class="form-label d-block">Payment method</span>
                <div class="btn-group flex-wrap" role="group" aria-label="Payment method">
                    <th:block th:each="m : ${methods}">
                        <input type="radio" class="btn-check" th:field="*{paymentMethod}" th:value="${m}" autocomplete="off">
                        <label class="btn btn-outline-primary" th:for="${#ids.prev('paymentMethod')}" th:text="${#strings.capitalize(#strings.toLowerCase(m))}"></label>
                    </th:block>
                </div></div>
            <div class="col-12"><label class="form-label" for="notes">Notes</label>
                <input class="form-control" th:field="*{notes}" maxlength="500"></div>
        </div></div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" type="submit" name="action" value="draft">Save draft</button>
            <button class="btn btn-primary" type="submit" name="action" value="confirm">Confirm sale</button>
            <a class="btn btn-outline-secondary" th:href="@{/sales}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>

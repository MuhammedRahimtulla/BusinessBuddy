<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Supplier | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><h1 th:text="${id == null} ? 'New supplier' : 'Edit supplier'">Supplier</h1></div>
    <div class="card form-card"><div class="card-body">
        <form th:action="${id == null} ? @{/suppliers} : @{/suppliers/{id}(id=${id})}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/ui :: errors('form')}"></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label required" for="name">Supplier name</label>
                    <input class="form-control" th:field="*{name}" maxlength="150" required th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div></div>
                <div class="col-md-6"><label class="form-label" for="contactPerson">Contact person</label>
                    <input class="form-control" th:field="*{contactPerson}" maxlength="120"></div>
                <div class="col-md-6"><label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div></div>
                <div class="col-md-6"><label class="form-label" for="phone">Phone</label>
                    <input class="form-control" type="tel" th:field="*{phone}" maxlength="30" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{phone}"></div></div>
                <div class="col-12"><label class="form-label" for="address">Address</label>
                    <input class="form-control" th:field="*{address}" maxlength="300"></div>
                <div class="col-12"><label class="form-label" for="notes">Notes</label>
                    <textarea class="form-control" th:field="*{notes}" rows="2"></textarea></div>
                <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label" th:for="${#ids.prev('active')}">Active</label></div>
            </div>
            <div class="mt-3 d-flex gap-2"><button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/suppliers}">Cancel</a></div>
        </form>
    </div></div>
</main>
</body>
</html>

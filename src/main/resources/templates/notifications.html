<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Notifications | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><div><h1>Notifications</h1>
        <p>"Observed" alerts describe the current state. "Predicted" alerts are estimates. Alerts resolve themselves when the condition clears.</p></div></div>
    <div class="table-wrap">
        <table class="table align-middle">
            <thead><tr><th>Date</th><th>Kind</th><th>Message</th><th>Status</th><th></th></tr></thead>
            <tbody>
            <tr th:each="n : ${page.content}">
                <td th:text="${@fmt.dateTime(n.createdAt, zone)}"></td>
                <td><span class="badge" th:classappend="${n.nature.name() == 'PREDICTED'} ? 'badge-predicted' : 'badge-observed'"
                          th:text="${n.nature.name() == 'PREDICTED'} ? 'Predicted' : 'Observed'"></span>
                    <div class="small text-muted" th:text="${n.type}"></div></td>
                <td th:text="${n.message}"></td>
                <td><span class="status" th:classappend="'status-' + ${n.status}" th:text="${n.status}"></span></td>
                <td><form th:if="${n.status.name() == 'OPEN'}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post">
                    <button class="btn btn-sm btn-outline-secondary" type="submit">Mark as read</button></form></td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="5" class="empty-state">No notifications.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-2" th:insert="~{fragments/ui :: pager('/notifications')}"></div>
</main>
</body>
</html>

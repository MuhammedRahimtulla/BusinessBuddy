<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Stock movements | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head">
        <div><h1>Inventory movement ledger</h1><p>Every stock change, newest first. Movements are never edited or deleted.</p></div>
    </div>
    <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/inventory/movements}">
        <div class="col-auto"><label class="form-label" for="type">Type</label>
            <select class="form-select form-select-sm" id="type" name="type">
                <option value="">All</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == type}"></option>
            </select></div>
        <div class="col-auto"><label class="form-label" for="from">From</label>
            <input class="form-control form-control-sm" type="date" id="from" name="from" th:value="${period.from}"></div>
        <div class="col-auto"><label class="form-label" for="to">To</label>
            <input class="form-control form-control-sm" type="date" id="to" name="to" th:value="${period.to}"></div>
        <div class="col-auto"><button class="btn btn-sm btn-outline-primary" type="submit">Apply</button></div>
    </form>
    <div class="table-wrap">
        <table class="table table-sm">
            <thead><tr><th>Date</th><th>Item</th><th>Type</th><th class="num">Change</th><th class="num" th:if="${canSeeMoney}">Unit cost</th>
                <th>Source</th><th>Reason</th><th>By</th></tr></thead>
            <tbody>
            <tr th:each="m : ${page.content}">
                <td th:text="${@fmt.dateTime(m.movementDate, zone)}"></td>
                <td th:text="${m.ingredient != null} ? ${m.ingredient.name} : ${m.product.name}"></td>
                <td th:text="${m.type}"></td>
                <td class="num" th:classappend="${@fmt.negative(m.quantityChange)} ? 'text-negative' : 'text-positive'"
                    th:text="|${@fmt.qty(m.quantityChange)} ${m.ingredient != null ? m.ingredient.baseUnit.code : m.product.saleUnit.code}|"></td>
                <td class="num" th:if="${canSeeMoney}" th:text="${@fmt.cost(m.unitCost)}"></td>
                <td th:text="${m.sourceType}"></td>
                <td th:text="${m.reason}"></td>
                <td th:text="${m.createdBy.fullName}"></td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="8" class="empty-state">No movements in this period.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-2" th:insert="~{fragments/ui :: pager('/inventory/movements?from=' + ${period.from} + '&to=' + ${period.to} + (${type} != null ? '&type=' + ${type} : ''))}"></div>
</main>
</body>
</html>

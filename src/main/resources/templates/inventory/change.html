<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Stock change | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><div><h1>Record waste or adjust stock</h1>
        <p>Waste reduces stock. Adjustments and returns may increase or decrease it and need an Owner or Manager.</p></div></div>
    <div class="card form-card"><div class="card-body">
        <form th:action="${types.size() > 1} ? @{/inventory/adjust} : @{/inventory/waste}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/ui :: errors('form')}"></div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label required" for="itemKey">Item</label>
                    <select class="form-select" th:field="*{itemKey}" required th:errorclass="is-invalid">
                        <option value="">Choose an item</option>
                        <optgroup label="Ingredients">
                            <option th:each="i : ${ingredients}" th:value="|I:${i.id}|" th:text="|${i.name} (${i.baseUnit.code}, in stock ${@fmt.qty(i.currentQuantity)})|"></option>
                        </optgroup>
                        <optgroup label="Products">
                            <option th:each="p : ${products}" th:value="|P:${p.id}|" th:text="|${p.name} (in stock ${@fmt.qty(p.currentQuantity)})|"></option>
                        </optgroup>
                    </select>
                    <div class="invalid-feedback" th:errors="*{itemKey}"></div>
                </div>
                <div class="col-md-6">
                    <span class="form-label required d-block">Type</span>
                    <div class="form-check form-check-inline" th:each="t : ${types}">
                        <input class="form-check-input" type="radio" th:field="*{type}" th:value="${t}">
                        <label class="form-check-label" th:for="${#ids.prev('type')}" th:text="${#strings.capitalize(#strings.toLowerCase(t))}"></label>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required" for="quantity">Quantity (in the item's stock unit)</label>
                    <input class="form-control" type="number" step="0.001" th:field="*{quantity}" required th:errorclass="is-invalid">
                    <div class="form-text">For an adjustment, use a minus sign to reduce stock.</div>
                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                </div>
                <div class="col-md-4" th:if="${types.size() > 1}">
                    <label class="form-label" for="unitCost">Unit cost (increases only)</label>
                    <input class="form-control" type="number" step="0.0001" min="0" th:field="*{unitCost}">
                    <div class="form-text">Defaults to the current average cost.</div>
                </div>
                <div class="col-12">
                    <label class="form-label required" for="reason">Reason</label>
                    <input class="form-control" th:field="*{reason}" minlength="3" maxlength="300" required th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{reason}"></div>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Record</button>
                <a class="btn btn-outline-secondary" th:href="@{/inventory}">Cancel</a>
            </div>
        </form>
    </div></div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Stock levels | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head">
        <div><h1>Stock levels</h1><p>Current quantities, kept in step with the inventory ledger.</p></div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/inventory/waste}">Record waste</a>
            <a sec:authorize="hasAnyRole('OWNER','MANAGER')" class="btn btn-outline-primary" th:href="@{/inventory/adjust}">Adjust stock</a>
            <a sec:authorize="hasAnyRole('OWNER','MANAGER')" class="btn btn-outline-secondary" th:href="@{/reports/reconciliation}">Reconcile with ledger</a>
        </div>
    </div>
    <div class="table-wrap">
        <table class="table table-hover table-sm align-middle">
            <thead><tr><th>Type</th><th>Item</th><th>Category</th><th class="num">Quantity</th><th>Unit</th><th class="num">Minimum</th>
                <th class="num" th:if="${canSeeMoney}">Avg cost</th><th class="num" th:if="${canSeeMoney}">Value</th><th></th></tr></thead>
            <tbody>
            <tr th:each="r : ${rows}">
                <td th:text="${r.type == 'INGREDIENT'} ? 'Ingredient' : 'Product'"></td>
                <td><a th:href="${r.type == 'INGREDIENT'} ? @{/ingredients/{id}(id=${r.id})} : @{/products/{id}(id=${r.id})}" th:text="${r.name}"></a></td>
                <td th:text="${r.category}"></td>
                <td class="num" th:classappend="${r.belowMinimum} ? 'text-negative'" th:text="${@fmt.qty(r.quantity)}"></td>
                <td th:text="${r.unit}"></td>
                <td class="num" th:text="${@fmt.qty(r.minimum)}"></td>
                <td class="num" th:if="${canSeeMoney}" th:text="${@fmt.cost(r.averageCost)}"></td>
                <td class="num" th:if="${canSeeMoney}" th:text="${@fmt.money(r.value)}"></td>
                <td><span th:if="${r.belowMinimum}" class="badge badge-observed">Low stock</span></td>
            </tr>
            <tr th:if="${rows.isEmpty()}"><td colspan="9" class="empty-state">No stock items yet.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>

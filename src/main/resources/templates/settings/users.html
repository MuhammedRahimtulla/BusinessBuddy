<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Users | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><div><h1>Users of the business</h1><p>Deactivate staff who leave instead of deleting them, so their history stays linked.</p></div></div>
    <div class="table-wrap mb-4">
        <table class="table align-middle">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Last login</th><th></th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.fullName}"></td><td th:text="${u.email}"></td>
                <th:block th:if="${u.role.name() == 'OWNER'}">
                    <td>Owner</td><td th:text="${u.active} ? 'Yes' : 'No'"></td>
                    <td th:text="${@fmt.dateTime(u.lastLoginAt, zone)}"></td><td></td>
                </th:block>
                <th:block th:unless="${u.role.name() == 'OWNER'}">
                    <td colspan="2">
                        <form th:action="@{/settings/users/{id}(id=${u.id})}" method="post" class="d-flex gap-2 align-items-center"
                              th:id="|user-form-${u.id}|">
                            <label class="visually-hidden" th:for="|role-${u.id}|">Role</label>
                            <select class="form-select form-select-sm w-auto" name="role" th:id="|role-${u.id}|">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option></select>
                            <div class="form-check mb-0"><input class="form-check-input" type="checkbox" name="active" value="true"
                                                               th:id="|active-${u.id}|" th:checked="${u.active}">
                                <label class="form-check-label" th:for="|active-${u.id}|">Active</label></div>
                            <button class="btn btn-sm btn-outline-primary" type="submit">Update</button>
                        </form>
                    </td>
                    <td th:text="${@fmt.dateTime(u.lastLoginAt, zone)}"></td><td></td>
                </th:block>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="card form-card"><div class="card-header">Add a staff account</div><div class="card-body">
        <form th:action="@{/settings/users}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/ui :: errors('form')}"></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label required" for="fullName">Full name</label>
                    <input class="form-control" th:field="*{fullName}" maxlength="120" required th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div></div>
                <div class="col-md-6"><label class="form-label required" for="email">Email</label>
                    <input class="form-control" type="email" th:field="*{email}" required autocomplete="off" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div></div>
                <div class="col-md-4"><label class="form-label required" for="role">Role</label>
                    <select class="form-select" th:field="*{role}"><option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option></select></div>
                <div class="col-md-8"><label class="form-label required" for="password">Initial password</label>
                    <input class="form-control" type="password" th:field="*{password}" minlength="10" required autocomplete="new-password">
                    <div class="form-text">At least 10 characters. Ask the person to change it after their first login.</div></div>
            </div>
            <div class="mt-3"><button class="btn btn-primary" type="submit">Create account</button></div>
        </form>
    </div></div>
</main>
</body>
</html>

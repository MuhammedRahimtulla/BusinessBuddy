<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Business profile | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><div><h1>Business profile and settings</h1><p>Tax rules are configurable and are not legal or tax advice.</p></div></div>
    <div class="card form-card"><div class="card-body">
        <form th:action="@{/settings/business}" th:object="${form}" method="post" novalidate>
            <div th:replace="~{fragments/ui :: errors('form')}"></div>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label required" for="name">Business name</label>
                    <input class="form-control" th:field="*{name}" maxlength="150" required th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div></div>
                <div class="col-md-6"><label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div></div>
                <div class="col-md-4"><label class="form-label" for="phone">Phone</label>
                    <input class="form-control" th:field="*{phone}" th:errorclass="is-invalid"><div class="invalid-feedback" th:errors="*{phone}"></div></div>
                <div class="col-md-8"><label class="form-label" for="address">Address</label>
                    <input class="form-control" th:field="*{address}" maxlength="300"></div>
                <div class="col-md-4"><label class="form-label required" for="currencyCode">Currency</label>
                    <select class="form-select" th:field="*{currencyCode}"><option th:each="c : ${currencies}" th:value="${c}" th:text="${c}"></option></select></div>
                <div class="col-md-8"><label class="form-label required" for="timeZone">Time zone</label>
                    <select class="form-select" th:field="*{timeZone}"><option th:each="z : ${timeZones}" th:value="${z}" th:text="${z}"></option></select></div>
                <div class="col-md-4"><label class="form-label required" for="taxRatePercent">Default tax rate (%)</label>
                    <input class="form-control" type="number" step="0.01" min="0" max="99.99" th:field="*{taxRatePercent}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{taxRatePercent}"></div></div>
                <div class="col-md-4"><label class="form-label required" for="targetMarginPercent">Target gross margin (%)</label>
                    <input class="form-control" type="number" step="0.01" min="0" max="99.99" th:field="*{targetMarginPercent}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{targetMarginPercent}"></div></div>
                <div class="col-md-4 pt-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{allowNegativeStock}">
                    <label class="form-check-label" th:for="${#ids.prev('allowNegativeStock')}">Allow negative stock</label></div>
                    <div class="form-text">Every movement that takes stock below zero is recorded in the audit log.</div></div>
            </div>
            <div class="mt-3"><button class="btn btn-primary" type="submit">Save settings</button></div>
        </form>
    </div></div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Customer | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><h1 th:text="${id == null} ? 'New customer' : 'Edit customer'">Customer</h1></div>
    <div class="card form-card"><div class="card-body">
        <form th:action="${id == null} ? @{/customers} : @{/customers/{id}(id=${id})}" th:object="${form}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label required" for="name">Name</label>
                    <input class="form-control" th:field="*{name}" maxlength="120" required th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div></div>
                <div class="col-md-6"><label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div></div>
                <div class="col-md-6"><label class="form-label" for="phone">Phone</label>
                    <input class="form-control" type="tel" th:field="*{phone}" maxlength="30" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{phone}"></div></div>
                <div class="col-md-6"><label class="form-label" for="notes">Notes</label>
                    <input class="form-control" th:field="*{notes}" maxlength="500"></div>
            </div>
            <div class="mt-3 d-flex gap-2"><button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/customers}">Cancel</a></div>
        </form>
    </div></div>
</main>
</body>
</html>

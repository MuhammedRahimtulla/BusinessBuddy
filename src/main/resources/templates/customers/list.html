<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Customers | BusinessBuddy</title></head>
<body>
<main>
    <div class="page-head"><h1>Customers</h1>
        <a class="btn btn-primary" th:href="@{/customers/new}"><i class="bi bi-plus-lg"></i> New customer</a></div>
    <form class="row g-2 mb-3" method="get" th:action="@{/customers}" role="search">
        <div class="col-sm-6 col-md-4"><label class="visually-hidden" for="q">Search</label>
            <input class="form-control" id="q" name="q" th:value="${q}" placeholder="Search by name or phone"></div>
        <div class="col-auto"><button class="btn btn-outline-primary" type="submit">Search</button></div>
    </form>
    <div class="table-wrap">
        <table class="table table-hover">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Notes</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${page.content}">
                <td th:text="${c.name}"></td><td th:text="${c.email}"></td><td th:text="${c.phone}"></td>
                <td th:text="${c.notes}"></td>
                <td><a th:href="@{/customers/{id}/edit(id=${c.id})}">Edit</a></td>
            </tr>
            <tr th:if="${page.content.isEmpty()}"><td colspan="5" class="empty-state">No customers yet.</td></tr>
            </tbody>
        </table>
    </div>
    <div class="mt-2" th:insert="~{fragments/ui :: pager('/customers?q=' + ${q})}"></div>
</main>
</body>
</html>
